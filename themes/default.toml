# Tema por defecto de turing-monitor: "registrador de banda".
#
# La forma viene de un registrador de papel continuo de laboratorio, y lo que
# la define no es la paleta sino la estructura: en vez de una tarjeta por
# metrica, hay UNA SOLA CINTA a todo el ancho donde tres plumas escriben
# sobre el mismo papel. Las cifras quedan relegadas al margen, debajo.
#
# Que CPU, GPU y FPS compartan eje no es decoracion: es la unica forma de ver
# cual de los tres va por detras de los otros, que es justo lo que se quiere
# saber mientras se juega. Tres graficas separadas no lo ensenan.
#
# Todo el texto va en grafito y el color se reserva a las plumas. La barra
# bajo cada cifra es a la vez su medida y su clave de color: la barra azul de
# CPU identifica el trazo azul de la cinta. El rojo no pertenece a ningun
# canal, solo aparece cuando algo se pasa de rosca.
#
# Pensado para la pantalla en horizontal (480x320): requiere
# `orientation = landscape`. Nada lleva coordenadas absolutas.

[theme]
name = "strip-chart"
author = "turing-lcd-rs"
margin = 6
background = "paper"
columns = 2
column_gap = 14

[palette]
# El papel y la reticula impresa. "panel" es el fondo por defecto de barras
# y graficos, asi que es la reticula quien lo ocupa.
paper = "#e6e2d6"
panel = "#cfc9b8"
# Grafito para todo el texto, mas claro para las anotaciones.
ink   = "#26251f"
faint = "#6b675a"
# Gris para las reglas: los dos limites de la cinta y los de la banda.
line  = "#a29c8b"
# El unico rojo del tema: solo aparece cuando algo se pasa de rosca.
alarm = "#9b2c16"
# Las plumas. Tintas de plotter, no colores de pantalla.
cpu   = "#1f5673"
gpu   = "#7d3f7d"
fps   = "#1f6b6b"
ram   = "#3d6b4a"
vram  = "#8a5a1e"

# ----------------------------------------------------------- cabecera
[[section]]
span = true
gap = 6
rows = [
  { text = "sys.hostname", size = 22, style = "bold", color = "ink",
    right = "up {sys.uptime|uptime}", right_size = 13, right_color = "faint" },
]

# ----------------------------------------------------------- la cinta
# El elemento que da nombre al tema y lo unico que ocupa el ancho entero.
#
# Sin titulo ni cifra: las dos reglas son la escala (arriba 100%, abajo 0) y
# las plumas hablan solas. Las tres series son fracciones 0..1, asi que
# comparten eje de verdad; fps.ratio se normaliza contra fps_target.
#
# `fill` igual a la reticula anula el relleno del sparkline: la primera serie
# queda como trazo de pluma de un pixel, igual que las que se superponen.
#
# La pista de una barra por hilo que iba aqui debajo se quito al agrandar el
# texto: repetia lo que ya dicen la cifra de CPU y su pluma, y su sitio lo
# aprovecha mejor el trazo, que asi separa las tres plumas sin amontonarlas.
# Se recupera anadiendo { cores = "cpu.cores", height = 12, color = "cpu" }.
# Sin juego en marcha fps.ratio no tiene historico y esa pluma no escribe.
[[section]]
span = true
gap = 6
rows = [
  { rule = true, track = "line" },
  { plot = ["cpu.usage", "gpu.usage", "fps.ratio"], height = 52,
    color = "cpu; gpu; fps", fill = "panel" },
  { rule = true, track = "line" },
]

# ----------------------------------------------------------- el margen
# Las lecturas, en cuerpo pequeno y a dos columnas. Ya no son el asunto
# principal: la cinta lo es.
[[section]]
column = 1
title = "CPU"
title_size = 20
value = "cpu.usage | percent"
value_size = 30
color = "ink -> alarm @ 0.85"
rows = [
  # La temperatura es lo unico del panel que cambia de color, y a 26 px
  # compite de tu a tu con el porcentaje: si algo se esta cociendo, se ve
  # antes que se lee. color_from es obligatorio aqui — la rampa necesita una
  # fraccion 0..1 y cpu.temp son grados, que saturarian el rojo siempre.
  { text = "cpu.temp | celsius", size = 26,
    color = "ink -> alarm @ 0.7", color_from = "cpu.temp_ratio",
    right = "cpu.freq | ghz", right_size = 13, right_color = "faint" },
  { bar = "cpu.usage", height = 10, color = "cpu" },
]

[[section]]
column = 1
title = "GPU"
title_size = 20
value = "gpu.usage | percent"
value_size = 30
color = "ink -> alarm @ 0.85"
require = "gpu.usage"
rows = [
  { text = "gpu.temp | celsius", size = 26,
    color = "ink -> alarm @ 0.7", color_from = "gpu.temp_ratio",
    # Sin dato a la derecha: el driver no expone frecuencia de GPU y repetir
    # aqui la VRAM, que ya tiene su propia lectura, seria ruido.
    },
  { bar = "gpu.usage", height = 10, color = "gpu" },
]

[[section]]
column = 2
title = "RAM"
title_size = 20
value = "mem.usage | percent"
value_size = 30
color = "ink -> alarm @ 0.85"
rows = [
  { text = "{mem.used|bytes} / {mem.total|bytes}", size = 14, color = "faint" },
  { bar = "mem.usage", height = 10, color = "ram" },
]

[[section]]
column = 2
title = "VRAM"
title_size = 20
value = "gpu.vram_usage | percent"
value_size = 30
color = "ink -> alarm @ 0.85"
require = "gpu.vram_usage"
rows = [
  { text = "{gpu.vram_used|bytes} / {gpu.vram_total|bytes}", size = 14, color = "faint" },
  { bar = "gpu.vram_usage", height = 10, color = "vram" },
]

# ----------------------------------------------------------- FPS
# Cruza las dos columnas y solo existe mientras MangoHud escribe un log, asi
# que aparece al arrancar el juego y se va sola al cerrarlo. El nombre del
# programa va en el propio titulo para no gastar una fila en el.
#
# Unico canal cuya rampa va al reves: fps.ratio vale 0 cuando la cosa va mal,
# de modo que la cifra arranca en rojo y llega al grafito en fps_target.
[[section]]
span = true
title = "FPS  {fps.app}"
title_size = 18
value = "fps | int"
value_size = 26
color = "alarm -> ink"
color_from = "fps.ratio"
require = "fps"
# Sin barra: la pluma de la cinta ya lleva el historico y una barra a 464 px
# al 100% seria la cosa mas ruidosa del panel para decir que todo va bien.
rows = []

# ----------------------------------------------------------- pie
# Quitado para que las dos temperaturas puedan ir a 26 px: era lo unico del
# panel que no cambiaba (el modelo de CPU) o que ya contaba otro elemento (el
# load, que es la pluma azul de la cinta). Es ademas el unico ejemplo de
# `anchor = "bottom"`, asi que se queda aqui por si hace falta.
#
# [[section]]
# anchor = "bottom"
# span = true
# rows = [
#   { rule = true, track = "line" },
#   { text = "cpu.model", size = 13, color = "faint",
#     right = "load {sys.load}", right_size = 13, right_color = "faint" },
# ]
