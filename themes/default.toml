# Tema por defecto de turing-monitor: "workspace".
#
# El panel como un escritorio mas de Hyprland, con el tema del sistema (Mono
# Burgundy, ~/.config/theme/palette.toml): arriba una barra como la de
# waybar, y cada magnitud es una ventana tileada con borde de 2 px, esquinas
# rectas y los mismos huecos que hyprland.lua (gaps_out 10, 5 + 5 dentro).
#
# Monocromo estricto, como la paleta ANSI del sistema: nada se distingue por
# color, todo por brillo. El bordo es solo alerta: en reposo todas las
# ventanas son iguales, y marco, cifra y barra de una se encienden cuando
# pasa del 85%; las temperaturas, desde los 70 grados.
#
# Apaisado (480x320): requiere `orientation = landscape`. Las dos filas de
# ventanas miden lo mismo porque la de abajo crece hasta el pie (`grow`).

[theme]
name = "workspace"
author = "turing-lcd-rs"
margin = 10
background = "base"
columns = 2
column_gap = 10
frame_width = 2
# Gris en reposo; solo se enciende en bordo la ventana que pasa del 85%.
frame_color = "line -> accent @ 0.85"

[palette]
# Copiados tal cual de ~/.config/theme/palette.toml.
base   = "#0b0b0b"
line   = "#2c2c2c"
dim    = "#505050"
muted  = "#8a8a8a"
fg     = "#c8c8c8"
bright = "#ededed"
accent = "#b8455a"

# ----------------------------------------------------------- la barra
# Como waybar: sin marco, una linea de 1 px debajo. Quien es esta maquina y
# cuanto lleva encendida.
[[section]]
span = true
gap = 10
rows = [
  { text = "sys.hostname", size = 14, color = "fg",
    right = "up {sys.uptime|uptime}", right_size = 14, right_color = "muted" },
  { rule = true, track = "line" },
]

# ----------------------------------------------------------- las ventanas
# Cuatro ventanas iguales. Arriba el nombre en gris y la cifra a la derecha,
# como el titulo y el contenido de una ventana; debajo la lectura secundaria
# y una barra fina. La carga de `color_from` es la que enciende el marco.
[[section]]
column = 1
frame = true
title = "cpu"
title_size = 14
title_color = "muted"
value = "cpu.usage | percent"
value_size = 34
color = "bright -> accent @ 0.85"
color_from = "cpu.usage"
gap = 10
rows = [
  # color_from es obligatorio: la rampa quiere una fraccion y cpu.temp son
  # grados, que saturarian el bordo siempre.
  { text = "cpu.temp | celsius", size = 16,
    color = "fg -> accent @ 0.7", color_from = "cpu.temp_ratio",
    right = "cpu.freq | ghz", right_size = 14, right_color = "muted" },
  { bar = "cpu.usage", height = 7, color = "fg -> accent @ 0.85", track = "line" },
]

[[section]]
column = 1
frame = true
grow = true
title = "gpu"
title_size = 14
title_color = "muted"
value = "gpu.usage | percent"
value_size = 34
color = "bright -> accent @ 0.85"
color_from = "gpu.usage"
require = "gpu.usage"
gap = 10
rows = [
  { text = "gpu.temp | celsius", size = 16,
    color = "fg -> accent @ 0.7", color_from = "gpu.temp_ratio" },
  { bar = "gpu.usage", height = 7, color = "fg -> accent @ 0.85", track = "line" },
]

[[section]]
column = 2
frame = true
title = "ram"
title_size = 14
title_color = "muted"
value = "mem.usage | percent"
value_size = 34
color = "bright -> accent @ 0.85"
color_from = "mem.usage"
gap = 10
rows = [
  { text = "{mem.used|bytes} / {mem.total|bytes}", size = 16, color = "fg" },
  { bar = "mem.usage", height = 7, color = "fg -> accent @ 0.85", track = "line" },
]

[[section]]
column = 2
frame = true
grow = true
title = "vram"
title_size = 14
title_color = "muted"
value = "gpu.vram_usage | percent"
value_size = 34
color = "bright -> accent @ 0.85"
color_from = "gpu.vram_usage"
require = "gpu.vram_usage"
gap = 10
rows = [
  { text = "{gpu.vram_used|bytes} / {gpu.vram_total|bytes}", size = 16, color = "fg" },
  { bar = "gpu.vram_usage", height = 7, color = "fg -> accent @ 0.85", track = "line" },
]

# ----------------------------------------------------------- los hilos
# Una ventana ancha al pie con una barra por hilo, lo unico que no cabe en
# una cifra. Sin `color_from` su marco no se enciende nunca: lo que hay
# dentro ya avisa en la ventana de CPU, y cada hilo se pinta solo.
[[section]]
span = true
anchor = "bottom"
frame = true
rows = [
  { text = "cpu.model", size = 13, color = "muted",
    right = "load {sys.load}", right_size = 13, right_color = "muted" },
  { cores = "cpu.cores", height = 47, color = "fg -> accent @ 0.9", track = "line" },
]
