# Tema por defecto de turing-monitor: "hoja de lecturas".
#
# El mismo papel de laboratorio de antes, pero sin la cinta: se quito el
# registrador de arriba y el sitio que ocupaba se lo reparten las cifras, que
# es lo que de verdad se lee de reojo en una pantalla de 3,5 pulgadas.
#
# Lo que ordena la hoja es la escala tipografica, no las cajas: cada magnitud
# se escribe grande, con su lectura secundaria debajo y una regla llena que
# hace de medida y de clave de color. Nada lleva marco.
#
# Todo el texto va en grafito y el color se reserva a las reglas. El rojo no
# pertenece a ningun canal, solo aparece cuando algo se pasa de rosca.
#
# Pensado para la pantalla en horizontal (480x320): requiere
# `orientation = landscape`. Nada lleva coordenadas absolutas.

[theme]
name = "reading-sheet"
author = "turing-lcd-rs"
margin = 6
background = "paper"
columns = 2
column_gap = 14

[palette]
# El papel y la reticula impresa. "panel" es el fondo por defecto de barras,
# asi que es la reticula quien lo ocupa.
paper = "#e6e2d6"
panel = "#cfc9b8"
# Grafito para todo el texto, mas claro para las anotaciones.
ink   = "#26251f"
faint = "#6b675a"
# Gris para las reglas impresas: la cabecera y el pie de FPS.
line  = "#a29c8b"
# El unico rojo del tema: solo aparece cuando algo se pasa de rosca.
alarm = "#9b2c16"
# Las tintas de cada canal. Solo pintan reglas, nunca texto.
cpu   = "#1f5673"
gpu   = "#7d3f7d"
ram   = "#3d6b4a"
vram  = "#8a5a1e"

# ----------------------------------------------------------- cabecera
# La unica linea de la hoja que no es una medida: quien es esta maquina y
# cuanto lleva encendida. La regla de debajo la separa de las lecturas.
[[section]]
span = true
gap = 8
rows = [
  { text = "sys.hostname", size = 22, style = "bold", color = "ink",
    right = "up {sys.uptime|uptime}", right_size = 14, right_color = "faint" },
  { rule = true, track = "line" },
]

# ----------------------------------------------------------- las lecturas
# Cuatro magnitudes a dos columnas. Cada una: titulo y porcentaje en la misma
# linea, la lectura secundaria debajo y la regla al pie.
[[section]]
column = 1
title = "CPU"
title_size = 22
value = "cpu.usage | percent"
value_size = 40
color = "ink -> alarm @ 0.85"
gap = 8
rows = [
  # La temperatura es lo unico del panel que compite en cuerpo con el
  # porcentaje: si algo se esta cociendo, se ve antes que se lee. color_from
  # es obligatorio aqui — la rampa necesita una fraccion 0..1 y cpu.temp son
  # grados, que saturarian el rojo siempre.
  { text = "cpu.temp | celsius", size = 28,
    color = "ink -> alarm @ 0.7", color_from = "cpu.temp_ratio",
    right = "cpu.freq | ghz", right_size = 14, right_color = "faint" },
  { bar = "cpu.usage", height = 14, color = "cpu" },
]

[[section]]
column = 1
title = "GPU"
title_size = 22
value = "gpu.usage | percent"
value_size = 40
color = "ink -> alarm @ 0.85"
require = "gpu.usage"
rows = [
  { text = "gpu.temp | celsius", size = 28,
    color = "ink -> alarm @ 0.7", color_from = "gpu.temp_ratio",
    # Sin dato a la derecha: el driver no expone frecuencia de GPU y repetir
    # aqui la VRAM, que ya tiene su propia lectura, seria ruido.
    },
  { bar = "gpu.usage", height = 14, color = "gpu" },
]

[[section]]
column = 2
title = "RAM"
title_size = 22
value = "mem.usage | percent"
value_size = 40
color = "ink -> alarm @ 0.85"
gap = 8
rows = [
  { text = "{mem.used|bytes} / {mem.total|bytes}", size = 20, color = "faint" },
  { bar = "mem.usage", height = 14, color = "ram" },
]

[[section]]
column = 2
title = "VRAM"
title_size = 22
value = "gpu.vram_usage | percent"
value_size = 40
color = "ink -> alarm @ 0.85"
require = "gpu.vram_usage"
rows = [
  { text = "{gpu.vram_used|bytes} / {gpu.vram_total|bytes}", size = 20, color = "faint" },
  { bar = "gpu.vram_usage", height = 14, color = "vram" },
]

# ----------------------------------------------------------- los hilos
# El pie: una barra por hilo de CPU, el unico dato del panel que no cabe en
# una cifra. Debajo de las lecturas y a todo el ancho, con el modelo y el
# load como anotacion al margen.
[[section]]
span = true
gap = 6
rows = [
  { rule = true, track = "line" },
  { text = "cpu.model", size = 14, color = "faint",
    right = "load {sys.load}", right_size = 14, right_color = "faint" },
  { cores = "cpu.cores", height = 32, color = "cpu" },
]
